name: Temporary production HTTP verification
on:
  pull_request:
    paths:
      - '.github/workflows/production-http-diagnostic.yml'
permissions:
  contents: read
jobs:
  production-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only DNS and HTTPS diagnostics
        shell: bash
        run: |
          for domain in sentinelops.world www.sentinelops.world; do
            echo "=== $domain DNS A/AAAA/NS ==="
            dig +time=3 +tries=1 "$domain" A || true
            dig +time=3 +tries=1 "$domain" AAAA || true
            dig +time=3 +tries=1 "$domain" NS || true
          done
          echo "=== HTTPS connection diagnosis ==="
          curl --verbose --head --connect-timeout 8 --max-time 12 https://sentinelops.world/ 2>&1 || true
      - name: Verify canonical production HTTP routes
        run: node scripts/check-live.mjs https://sentinelops.world
